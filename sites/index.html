<!DOCTYPE html>
<html>

<head>
    <title>G33X</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/index.css">
</head>

<body onload="indexOnloadFunc(), mainOnLoadFunc()">
    <header>
        <h1><a href="../sites/index.html">G33X</a></h1>
        <h1><a href="../sites/wishlist.html">Wishlist</a></h1>
        <h1><a href="../sites/cart.html">Cart</a></h1>
    </header>
    <main>
        <h1>Available Games</h1>
        <h2>Categories</h2>
        <div id="Categories">
            <h4>Action</h4>
            <h4>Puzzle</h4>
            <h4>F2P</h4>
            <h4>Under 5€</h4>
        </div>
        <div id="mostPopularGamesDiv">
            <h2>Most popular games</h2>
            <div id="mostPopularGames">
                <div class="homepageItemDivOut">
                    <div class="homepageItemDivIn">
                        <div class="homepageItemHeroImgDiv">
                            <img class="homepageItemHeroImg" src="../img/Cyberpunk_2077.jpg" alt="Cyberpunk_2077-hero">
                        </div>
                        <div class="homepageItemBelowDiv">
                            <h3 class="homepageItemTitle">Cyberpunk 2077</h3>
                            <div class="homepageItemBtnDiv">
                                <button class="homepage_wishlistBtn" onclick="homepage_wishlistBtnClicked(this)"></button>
                                <button class="homepage_addToCartBtn" onclick="homepage_addToCartBtnClicked(this)"></button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="homepageItemDivOut">
                    <div class="homepageItemDivIn">
                        <div class="homepageItemHeroImgDiv">
                            <img class="homepageItemHeroImg" src="../img/Viewfinder.jpg" alt="Viewfinder-hero">
                        </div>
                        <div class="homepageItemBelowDiv">
                            <h3 class="homepageItemTitle">Viewfinder</h3>
                            <div class="homepageItemBtnDiv">
                                <button class="homepage_wishlistBtn" onclick="homepage_wishlistBtnClicked(this)"></button>
                                <button class="homepage_addToCartBtn" onclick="homepage_addToCartBtnClicked(this)"></button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="homepageItemDivOut">
                    <div class="homepageItemDivIn">
                        <div class="homepageItemHeroImgDiv">
                            <img class="homepageItemHeroImg" src="../img/Heroes of Might and Magic III.jpg" alt="Heroes_III-hero">
                        </div>
                        <div class="homepageItemBelowDiv">
                            <h3 class="homepageItemTitle">Heroes III</h3>
                            <div class="homepageItemBtnDiv">
                                <button class="homepage_wishlistBtn" onclick="homepage_wishlistBtnClicked(this)"></button>
                                <button class="homepage_addToCartBtn" onclick="homepage_addToCartBtnClicked(this)"></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="../js/main.js"></script>
    <script src="../js/index.js"></script>
</body>

</html>
